name: ORACLE onchain controls OFF
on:
  pull_request:
    branches: [feat/251-evidence-risk-readout]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  onchain-rules-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Actual pure binary JSON provenance and malicious-control tests no provider traffic
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/run.sh
      - name: Current head types lint optimized build default-OFF actual artifact archive and source guard
        run: |
          npx tsc --noEmit
          npm run lint
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/replay.sh built
          bash scripts/archive-tool.sh check 8c89c37a2d738ec1e9ab48b9a7a38510b7f30e2e
          node --test tests/v4-oracle-onchain/scope.test.mjs
  inherited-native-and-root:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - name: Current exact251 native non-superuser TLS owner durable quotas and STOP unchanged
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/replay.sh native
      - name: All original root assertions and source contracts unchanged on their exact reviewed inputs
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/replay.sh source
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/replay.sh root
  immutable-source-history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-oracle-onchain/replay.sh history
