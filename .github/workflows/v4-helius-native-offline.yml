name: V4 native Helius producer OFF
on:
  pull_request:
    branches: [feat/227-owner-pg-off]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  native-producer-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: New producer native local TLS and atomic PostgreSQL
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-helius-native/run.sh
      - name: Original exact 229 and unchanged parent J P A B C source guards
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-helius-native/source-history.sh
      - name: Full root native Node Python security regression
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm test
      - name: Types lint archive optimized build actual built OFF final scope
        run: |
          npx tsc --noEmit
          npm run lint
          bash scripts/archive-tool.sh check 6efb0eb66a79087b9c7a59b9a06ad584e9130ee9
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/live-ledger/built-api.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/continuous-ledger/built-api.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/v4-helius-native/scope.test.mjs
