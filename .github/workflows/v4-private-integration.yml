name: V4.2 immutable private integration
on:
  pull_request:
    branches: [integration/v4-alpha-lens-source-off]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  immutable-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Current finite composition, actual A/B/C and bridge controls
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-private-integration/run.sh
      - name: Exact unmodified J/P and original A/B/C source-tree controls
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-private-integration/source-history.sh
      - name: Complete root and native PostgreSQL/TLS/auth/STOP
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm test
      - name: Types lint build OFF archive and final composition
        run: |
          npx tsc --noEmit
          npm run lint
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/live-ledger/built-api.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/continuous-ledger/built-api.mjs
          bash scripts/archive-tool.sh check b56475c681311d35f95ee9879d9969b868a1724e
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/v4-private-integration/scope.test.mjs
