        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Original265271272273275276277278 finite reviewers on immutable inputs NO SQL
        run: bash tests/jupiter-stop-correction/replay.sh
  original-mobile-source-held-guards:
    if: github.head_ref == 'fix/279-clock-stop'
    runs-on: ubuntu-latest
