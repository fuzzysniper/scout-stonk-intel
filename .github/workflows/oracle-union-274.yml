name: ORACLE274 exact TAKE recovery union OFF
on:
  pull_request:
    branches: [feat/274-the-take]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PRODUCTION_RPC_ENABLED: 'false'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  actual-union-postgres-security-models:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - name: Actual union guard recovery v2 and real disposable PG18 TLS PLUS
        run: NODE_ENV=test NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test --test-concurrency=1 tests/oracle-union-274/scope.test.mjs tests/oracle-ca-recovery-v2/verifier.test.mjs tests/oracle-ca-recovery-v2/postgres.test.mjs
      - name: Actual issuer owner auth signature STOP native and source contracts
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-source-install-266/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-claim-266/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-take-274/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-mount-266/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-mount-266/run.sh peers
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-lens/source-tests.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/oracle-union-274/scope.test.mjs
  actual-union-types-build-OFF:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext --target ES2023 ops/v4-journal/recovery-v2.d.mts
      - run: npm run lint
      - name: Optimized actual union OFF payload trace bootstrap and archive
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/v4-oracle-onchain/built-off.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-integration-271/artifact.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/oracle-union-274/artifact.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/oracle-union-274/scope.test.mjs
          bash scripts/archive-tool.sh check 8effe6ba0967d7a83e976840d5ed8df1d95fcbf5
  actual-union-mobile-provenance:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix experiments/consumer-mvp/web --ignore-scripts
      - name: Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CONSUMER_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node experiments/consumer-mvp/web/node_modules/@playwright/test/cli.js install --with-deps chromium
          fi
      - name: Actual TAKE claims mount one-tap provenance expiry STOP keyboard axe reflow and no extra IO
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-take-274/run.sh browser
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-claim-266/run.sh browser
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-mount-266/run.sh browser
          mkdir -p node_modules/.cache/oracle274-union-synthetic
          cp -a docs/oracle-take-274 node_modules/.cache/oracle274-union-synthetic/take
          cp -a docs/oracle-claim-266 node_modules/.cache/oracle274-union-synthetic/claims
          cp -a docs/oracle-266/screenshots node_modules/.cache/oracle274-union-synthetic/mount
          git restore -- docs/oracle-take-274/*.png docs/oracle-claim-266/*.png docs/oracle-266/screenshots/*.png
      - name: Actual optimized Next source OFF plus two unchanged optimized browser suites
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-integration-271/artifact.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/oracle-union-274/artifact.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-v5/run.sh artifact
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-take-274/run.sh optimized
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/oracle-union-274/scope.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle274-union-LOCAL-SYNTHETIC-mobile
          path: node_modules/.cache/oracle274-union-synthetic/**/*.png
  immutable-exact-input-reviews:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_ENV=test NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-union-274/replay.sh inputs
  original-immutable-security-reviews:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-union-274/replay.sh reviews
  original-native-TLS-root:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-union-274/replay.sh native-root
  original-immutable-security-history:
    if: github.head_ref == 'integration/274-take-recovery-off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-union-274/replay.sh history
