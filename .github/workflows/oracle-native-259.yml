name: ORACLE trusted mint producer OFF
on:
  pull_request:
    branches: [feat/258-oracle-integrated-preview]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  native-postgres-TLS-owner-admission:
    if: github.head_ref == 'feat/259-trusted-mint-producer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - name: Actual original SQL owner sessions and loopback native bytes STOP budgets failures no provider traffic
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-native-259/run.sh
  exact-head-contracts-build-and-OFF:
    if: github.head_ref == 'feat/259-trusted-mint-producer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: New finite review and original exact258 A B C reviewers
        run: |
          node --test tests/oracle-native-259/scope.test.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-native-259/replay.sh review
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-native-259/replay.sh inputs
      - name: Current actual parent UI source and A B functional contracts unchanged
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-lens/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-lens/source-tests.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-lens/peer-tests.sh
      - name: Exact head types lint optimized app actual HTTP OFF and archive
        run: |
          npx tsc --noEmit
          npm run lint
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/v4-oracle-onchain/built-off.mjs
          bash scripts/archive-tool.sh check 34d6a59763d62399cdcd94f7bccb7ea89e579a18
          node --test tests/oracle-native-259/scope.test.mjs
  original-native-and-root:
    if: github.head_ref == 'feat/259-trusted-mint-producer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-native-259/replay.sh a-native-root
  original-immutable-history:
    if: github.head_ref == 'feat/259-trusted-mint-producer'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-native-259/replay.sh a-history
