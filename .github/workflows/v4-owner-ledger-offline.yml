name: V4 owner and durable pilot OFF
on:
  pull_request:
    branches: [integration/v4-alpha-private-disabled]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  native-owner-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Actual signed-cookie owner and disposable native PostgreSQL TLS ledger
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-owner-ledger/run.sh
      - name: Current exact dependency and A B C J P contracts
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-private-integration/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-private-journal/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-helius-pilot/run.sh
      - name: Unchanged original parent and J P A B C source-tree guards
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-owner-ledger/source-history.sh
      - name: Full root Node Python native security regression
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm test
      - name: Types lint exact-target archive optimized build and actual built OFF
        run: |
          npx tsc --noEmit
          npm run lint
          bash scripts/archive-tool.sh check 4af9532709c3a9bca9efe71356124328955a2877
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/live-ledger/built-api.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/continuous-ledger/built-api.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node --test tests/v4-owner-ledger/scope.test.mjs
