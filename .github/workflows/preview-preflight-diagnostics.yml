name: Preview preflight diagnostics OFFLINE no SQL
on:
  pull_request:
    branches: [fix/289-publisher-diagnostics-off, native-pilot/private-beta-rc]
permissions:
  contents: read
jobs:
  reviewed-predicate-transport-and-reachability:
    if: (github.head_ref == 'ops/293-get-only-inspection' || github.head_ref == 'fix/294-release-ci-prerequisites' || github.head_ref == 'native-pilot/private-beta-rc') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Pinned public dependencies only
        run: |
          npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.9.0'
          npm ci --ignore-scripts
          npm ci --prefix ops/native-beta-output/toolchain --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import {tools} from './ops/native-beta-output/build.mjs'; tools('ops/native-beta-output/toolchain');"
          node tests/preview-inspection/legacy-tools.mjs
      - name: Offline regression and exact predicate-preservation proofs
        run: |
          export NODE_OPTIONS="--import=$PWD/tests/security114/local-only.mjs --import=$PWD/tests/native-postgres/no-database.mjs"
          node --test tests/preview-inspection/*.test.mjs tests/preview-preflight-diagnostics/contracts.test.mjs tests/preview-preflight-diagnostics/transport.test.mjs tests/preview-preflight-diagnostics/tar-reachability.test.mjs tests/native-beta-output/output.test.mjs tests/native-beta-output/verify.test.mjs tests/native-beta-output/upload.test.mjs tests/native-beta-output/workflow.test.mjs
          node --test tests/uploader-security/graph.test.mjs
          bash tests/native-publisher-diagnostics/run.sh
          bash tests/preview-preflight-diagnostics/tls-isolated.sh
          ./node_modules/.bin/tsc --noEmit
          npm run lint
          npm run build
          git restore -- next-env.d.ts
          bash scripts/archive-tool.sh check 905f5e68a2d53a3d1e54747e0b4a9632e96b0f8a
          node --test tests/preview-inspection/scope.test.mjs
