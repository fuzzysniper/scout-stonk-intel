name: PG18 non-superuser installer
on:
  pull_request:
    branches: [feat/243-ca-owner-preview]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  source-and-native-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: New exact source contracts local HTTPS precision rights gates and fail-grey controls
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh source
      - name: Disposable pinned public PostgreSQL18.6 build
        run: bash tests/v4-neon-durability/build-pg18.sh
      - name: Actual NON-superuser18 installer issuer ACL and current owner/native security
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/run.sh
      - name: Original exact246 finite source guards remain unchanged
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh guards
      - name: Full exact inherited root regression with ALL original guards unchanged
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh root
      - name: Current head types lint build built OFF archive final exact guard
        run: |
          npx tsc --noEmit
          npm run lint
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh built
          bash scripts/archive-tool.sh check 334400a6535d198a36bc17433d7e2813d855e603
          node --test tests/v4-pg18-install/scope.test.mjs
  unchanged-historical-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: bash tests/v4-neon-durability/build-pg18.sh
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh history
  unchanged-browser-and-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix experiments/consumer-mvp/web --ignore-scripts
      - name: Local Chromium test browser and privileged fixture TLS port
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CONSUMER_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node experiments/consumer-mvp/web/node_modules/@playwright/test/cli.js install --with-deps chromium
          fi
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Disposable pinned PostgreSQL18.6 for actual current CA owner journey
        run: bash tests/v4-neon-durability/build-pg18.sh
      - name: Actual current CA-first real password SQL and source-OFF browser acceptance
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/run.sh browser
      - run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/v4-pg18-install/replay.sh browser
