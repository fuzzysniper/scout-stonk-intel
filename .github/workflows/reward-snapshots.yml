name: Collect reward snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: reward-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/collect_rewards.py
      - name: Commit observed data
        run: |
          git config user.name "scout-data-bot"
          git config user.email "scout-data-bot@users.noreply.github.com"
          git add data/reward-snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m "data: append observed StonkFun reward snapshots"
            git push
          fi
