name: Synthetic Jupiter approval prototype NO SQL or source
on:
  pull_request:
    branches: [beta/276-jupiter-founder-only]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PRODUCTION_RPC_ENABLED: 'false'
  UNFARMD_DATA_ACTIVATION: disabled
  UNFARMD_CONTINUOUS_ACTIVATION: disabled
  SCOUT_LIVE_API_ENABLED: 'false'
  SCOUT_LIVE_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_API_ENABLED: 'false'
  SCOUT_CONTINUOUS_CONTROL_ENABLED: 'false'
  SCOUT_CONTINUOUS_STORE_ENABLED: 'false'
  SCOUT_CONTINUOUS_MAINTENANCE_ENABLED: 'false'
jobs:
  synthetic-security-crypto-budget-legacy:
    if: github.head_ref == 'feat/277-synthetic-beta-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Finite immutable277 source and mode guards with negative controls
        run: node --test tests/jupiter-approval-prototype/scope.test.mjs
      - name: Synthetic two-role policy proof verifier concurrency revocation replay and loopback security
        run: node --import=./tests/security114/local-only.mjs --test tests/jupiter-approval-prototype/{protocol,policy,validator,budget,http}.test.mjs
      - name: Original277 verifier positive controls and cross-protocol rejection
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/jupiter-approval-prototype/legacy.sh
      - name: Public contract negative type checks
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2023 --module NodeNext --moduleResolution NodeNext --skipLibCheck tests/jupiter-approval-prototype/types.mts
  synthetic-mobile-local-only:
    if: github.head_ref == 'feat/277-synthetic-beta-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix experiments/consumer-mvp/web --ignore-scripts
      - name: Existing local Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CONSUMER_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node experiments/consumer-mvp/web/node_modules/@playwright/test/cli.js install --with-deps chromium
          fi
      - name: 3203901280 actual local lab axe keyboard expiry STOP and no storage
        run: NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node experiments/consumer-mvp/web/node_modules/@playwright/test/cli.js test -c tests/jupiter-approval-prototype/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SYNTHETIC-LOCAL-Jupiter-approval-NO-live-auth
          path: node_modules/jupiter-approval-prototype-screenshots/*.png
      - run: node --test tests/jupiter-approval-prototype/scope.test.mjs
  unchanged-app-build-OFF-archive:
    if: github.head_ref == 'feat/277-synthetic-beta-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Unchanged277 admission and original claim source engines
        run: |
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/jupiter-beta-276/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-take-274/run.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-lens/source-tests.sh
      - name: Types lint optimized build and actual OFF import separation
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm run lint
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs npm run build
          git restore -- next-env.d.ts
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/v4-oracle-onchain/built-off.mjs
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs bash tests/oracle-integration-271/artifact.sh
          NODE_OPTIONS=--import=$PWD/tests/security114/local-only.mjs node tests/jupiter-beta-276/artifact.mjs
          node tests/jupiter-approval-prototype/artifact.mjs
          bash scripts/archive-tool.sh check 672229542d68b81caa955a16387fd92527f1bb9d
          node --test tests/jupiter-approval-prototype/scope.test.mjs
  original-immutable-reviewers:
    if: github.head_ref == 'feat/277-synthetic-beta-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: Original265271272273275276277 finite reviewers on immutable inputs NO SQL
        run: bash tests/jupiter-approval-prototype/replay.sh
  original-mobile-source-held-guards:
    if: github.head_ref == 'feat/277-synthetic-beta-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix experiments/consumer-mvp/web --ignore-scripts
      - name: Existing local Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CONSUMER_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node experiments/consumer-mvp/web/node_modules/@playwright/test/cli.js install --with-deps chromium
          fi
      - name: Original114 browser guards unchanged on exact277 NO SQL
        run: bash tests/jupiter-approval-prototype/original-mobile.sh
