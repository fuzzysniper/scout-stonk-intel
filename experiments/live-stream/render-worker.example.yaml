# Review-only fragment for B's ops manifest; NOT a root Blueprint or deployment instruction.
# Paid runtime proposal: exact cost/region/plan must be approved before provisioning.
services:
  - type: worker
    name: unfarmd-helius-creations
    runtime: node
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: bash experiments/live-stream/render-build.sh
    startCommand: node experiments/live-stream/run.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: UNFARMD_DATA_ACTIVATION
        value: disabled
      - key: UNFARMD_DATA_APPROVAL_JSON
        sync: false
      - key: UNFARMD_HELIUS_DATA_KEY
        sync: false
# B supplies separately approved isolated DB bindings; no existing proof binding is reused.
