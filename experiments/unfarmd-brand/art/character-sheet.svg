 <g fill="#20231f" font-family="Arial,sans-serif"><text x="50" y="540" font-size="19" font-weight="700">SHEEP</text><text x="50" y="570" font-size="17">The skeptic</text><text x="50" y="596" font-size="13">Broken tag. Checks the story.</text></g><g fill="#20231f" font-family="Arial,sans-serif"><text x="333" y="540" font-size="19" font-weight="700">GOAT</text><text x="333" y="570" font-size="17">The route-finder</text><text x="333" y="596" font-size="13">Finds the gap. Not the hype.</text></g><g fill="#20231f" font-family="Arial,sans-serif"><text x="616" y="540" font-size="19" font-weight="700">PIG</text><text x="616" y="570" font-size="17">The fine-print reader</text><text x="616" y="596" font-size="13">The footnote has a footnote.</text></g><g fill="#20231f" font-family="Arial,sans-serif"><text x="899" y="540" font-size="19" font-weight="700">COW</text><text x="899" y="570" font-size="17">The steady hand</text><text x="899" y="596" font-size="13">Hard to rush. Harder to fool.</text></g><g fill="#20231f" font-family="Arial,sans-serif"><text x="1182" y="540" font-size="19" font-weight="700">CHICKEN</text><text x="1182" y="570" font-size="17">The first to notice</text><text x="1182" y="596" font-size="13">Cautious is not cowardly.</text></g>
