# REVIEW TEMPLATE ONLY. Creating a new paid service requires separate founder GO.
# A owns experiments/live-stream/**; confirm its reviewed start script before applying.
services:
  - type: worker
    name: scout-live-creation-worker
    runtime: node
    repo: https://github.com/fuzzysniper/scout-stonk-intel
    branch: main
    autoDeploy: false
    numInstances: 1
    buildCommand: bash experiments/live-stream/render-build.sh
    startCommand: node experiments/live-stream/run.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: SCOUT_LIVE_STORE_ENABLED
        value: "false"
      - key: UNFARMD_DATA_ACTIVATION
        value: "disabled"
      - key: UNFARMD_DATA_APPROVAL_JSON
        sync: false
      - key: UNFARMD_HELIUS_DATA_KEY
        sync: false
      - key: SCOUT_LIVE_WORKER_DATABASE_URL
        sync: false
      - key: SCOUT_LIVE_RENDER_SERVICE_ID
        sync: false
# Deliberately no plan/billing selection, datastore provisioning, cron, scaling, reader/STOP DSNs,
# owner token, existing proof key or old trading-bot references. A's exact DATA-key/session variables
# must be reviewed against its fragment; no placeholder credentials or env-group inheritance.
